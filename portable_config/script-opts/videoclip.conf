# videoclip (nixpkgs, the dotfiles add it). https://github.com/Ajatt-Tools/videoclip
# c opens its menu: s start, e end, c makes the clip. visible subtitles are
# burned in, m before c makes it silent. what's not here is its default

# its menu at the left middle, the top left is uosc's title
osd_align=4

# 1080p (4k comes down, smaller goes up), h.264 crf 20: clips of films.
# crf wins over its default 1M bitrate
video_width=-2
video_height=1080
video_quality=20
preset=faster

# aac for sharing, opus here is tuned for speech
audio_format=aac
audio_bitrate=160k

# the same font as the subtitles in the player
sub_font=Clear Sans Bold
