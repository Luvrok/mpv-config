# clip (portable_config/scripts/clip.lua). https://github.com/Luvrok/mpv-config
# c opens its menu: s start, e end, enter on "create clip" cuts. the streams
# are copied, nothing is re-encoded. what's not here is set in the menu and
# remembered in ~~state/clip-output

# where the clips go until another folder is picked in the menu. ~ works;
# empty means the XDG videos folder (xdg-user-dir VIDEOS)
output_folder=

# %n name, %s start, %e end. the extension is always .mkv
filename_template=%n_%s-%e

# the key that opens the menu
key=c

# exact mode runs this binary, the dotfiles install their pinned smartcut
smartcut=smartcut

# quality of the few GOPs smartcut re-encodes at the cut points:
# near-lossless, lossless, indistinguishable, high, normal, low
exact_quality=near-lossless
