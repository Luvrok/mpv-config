# SmartSkip (nixpkgs, the dotfiles add it). https://github.com/Eisa01/mpv-scripts
#
# nothing skips by itself: an opening, ending or preview chapter only shows
# a prompt for a few seconds. > (input.conf) skips: the chapter, prompt or
# not, or past the next silence in a file without chapters. esc hides the
# prompt. its own keys are off: enter is the next file here

autoskip_chapter=yes
autoskip_countdown=5
autoskip_countdown_graceful=yes

# ~~/ is the read-only nix store here, and chapters are never written anyway
global_chapters_path=/:var%HOME%/.local/state/mpv/chapters
modified_chapters_autosave=[]
add_chapter_on_skip=no

toggle_autoskip_keybind=[""]
toggle_category_autoskip_keybind=[""]
add_chapter_keybind=[""]
remove_chapter_keybind=[""]
edit_chapter_keybind=[""]
write_chapters_keybind=[""]
bake_chapters_keybind=[""]
chapter_next_keybind=[""]
chapter_prev_keybind=[""]
smart_next_keybind=[""]
smart_prev_keybind=[""]
silence_skip_keybind=[""]
cancel_autoskip_countdown_keybind=["esc"]
proceed_autoskip_countdown_keybind=[""]
